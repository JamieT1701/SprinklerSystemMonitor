<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 485" role="img" aria-label="Board B has exactly two three-position terminal blocks. R5 bridges temperature 3V3 and DATA on the solder side." style="font-family:Arial,sans-serif"><title>Board B has exactly two three-position terminal blocks. R5 bridges temperature 3V3 and DATA on the solder side.</title><rect width="980" height="485" fill="#fcfdfb"/><text x="25" y="36" font-size="24" fill="#203339" text-anchor="start" font-weight="bold">BOARD B - WIRE THESE SIX SCREWS</text><text x="240" y="91" font-size="23" fill="#203339" text-anchor="middle" font-weight="bold">J1 PRESSURE</text><g data-terminal-block="J1"><rect x="70" y="110" width="340" height="90" rx="4" fill="#28794b" stroke="#15592f" stroke-width="2"/><circle cx="127" cy="140" r="14" fill="#dce4db"/><line x1="119" y1="140" x2="135" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="127" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1 +5V</text><circle cx="240" cy="140" r="14" fill="#dce4db"/><line x1="232" y1="140" x2="248" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="240" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2 GND</text><circle cx="353" cy="140" r="14" fill="#dce4db"/><line x1="345" y1="140" x2="361" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="353" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">3 SIG</text></g><text x="715" y="91" font-size="23" fill="#203339" text-anchor="middle" font-weight="bold">J2 TEMPERATURE</text><g data-terminal-block="J2"><rect x="545" y="110" width="340" height="90" rx="4" fill="#28794b" stroke="#15592f" stroke-width="2"/><circle cx="602" cy="140" r="14" fill="#dce4db"/><line x1="594" y1="140" x2="610" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="602" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1 3V3</text><circle cx="715" cy="140" r="14" fill="#dce4db"/><line x1="707" y1="140" x2="723" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="715" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2 DATA</text><circle cx="828" cy="140" r="14" fill="#dce4db"/><line x1="820" y1="140" x2="836" y2="140" stroke="#6c7e72" stroke-width="3"/><text x="828" y="181" font-size="18" fill="white" text-anchor="middle" font-weight="bold">3 GND</text></g><text x="100" y="228" font-size="16" fill="#bb3d30" text-anchor="start" font-weight="normal">W01</text><text x="185" y="228" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">W03 / W08</text><text x="315" y="228" font-size="16" fill="#28794b" text-anchor="start" font-weight="normal">W09</text><text x="570" y="228" font-size="16" fill="#b66a10" text-anchor="start" font-weight="normal">W02 / W07</text><text x="695" y="228" font-size="16" fill="#8257a5" text-anchor="start" font-weight="normal">W04</text><text x="805" y="228" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">GND</text><line x1="602" y1="200" x2="602" y2="275" stroke="#b66a10" stroke-width="3"/><line x1="715" y1="200" x2="715" y2="275" stroke="#8257a5" stroke-width="3"/><line x1="602" y1="275" x2="629.5" y2="275" stroke="#46565b" stroke-width="3"/><rect x="629.5" y="266" width="58" height="18" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="687.5" y1="275" x2="715" y2="275" stroke="#46565b" stroke-width="3"/><text x="658.5" y="256" font-size="16" fill="#203339" text-anchor="middle" font-weight="bold">R5 4.7k</text><line x1="240" y1="200" x2="240" y2="355" stroke="#46565b" stroke-width="3"/><line x1="240" y1="355" x2="828" y2="355" stroke="#46565b" stroke-width="3"/><line x1="828" y1="355" x2="828" y2="200" stroke="#46565b" stroke-width="3"/><text x="300" y="387" font-size="18" fill="#203339" text-anchor="start" font-weight="normal">J1-2 and J2-3 are joined to the same GND pad.</text><text x="25" y="435" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">R5 bridges the solder pads for J2-1 and J2-2; do not clamp its legs under the field-wire screws.</text><text x="25" y="464" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">All permanent internal wires attach to solder pads/underside joints, leaving the screws for sensor wires.</text></svg>