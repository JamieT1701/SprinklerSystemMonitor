<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" aria-label="Two small perfboards and one separately mounted controller. Only Board B has the two sensor terminal blocks." style="font-family:Arial,sans-serif"><title>Two small perfboards and one separately mounted controller. Only Board B has the two sensor terminal blocks.</title><rect width="980" height="610" fill="#fcfdfb"/><rect x="15" y="20" width="950" height="570" rx="16" fill="#eff1e9" stroke="#879c95" stroke-width="2"/><text x="35" y="52" font-size="20" fill="#203339" text-anchor="start" font-weight="bold">TOP VIEW - PLACEMENT PLAN, NOT A DRILLING TEMPLATE</text><rect x="90" y="85" width="620" height="100" rx="7" fill="#293740" stroke="#293740" stroke-width="2"/><text x="118" y="121" font-size="23" fill="white" text-anchor="start" font-weight="bold">ESP32-S3 + factory PoE module</text><text x="118" y="153" font-size="17" fill="#d4e5eb" text-anchor="start" font-weight="normal">Own insulated supports; USB / BOOT / RESET accessible</text><rect x="710" y="100" width="80" height="70" rx="3" fill="#c9d3d8" stroke="#7a8d94" stroke-width="2"/><text x="750" y="143" font-size="18" fill="#203339" text-anchor="middle" font-weight="bold">RJ45</text><line x1="791" y1="135" x2="928" y2="135" stroke="#2564b6" stroke-width="8"/><text x="810" y="106" font-size="16" fill="#2564b6" text-anchor="start" font-weight="normal">Ethernet</text><rect x="40" y="235" width="410" height="310" rx="10" fill="#f0f8ea" stroke="#83a66f" stroke-width="2"/><text x="63" y="268" font-size="22" fill="#203339" text-anchor="start" font-weight="bold">BOARD A - 70 x 50 mm</text><text x="63" y="296" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">No sensor terminal blocks on this board.</text><rect x="70" y="325" width="150" height="120" rx="7" fill="#dcebf6" stroke="#6690aa" stroke-width="2"/><text x="145" y="362" font-size="23" fill="#203339" text-anchor="middle" font-weight="bold">ADS1115</text><text x="145" y="389" font-size="16" fill="#203339" text-anchor="middle" font-weight="normal">use actual</text><text x="145" y="413" font-size="16" fill="#203339" text-anchor="middle" font-weight="normal">pin labels</text><text x="245" y="342" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">R1 10k</text><text x="245" y="373" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">R2 10k</text><text x="245" y="404" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">R3 4.7k</text><text x="245" y="435" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">R4 1k</text><text x="73" y="480" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">C1: A0 filter, 100 nF</text><text x="73" y="509" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">C2: ADS supply bypass, 100 nF</text><rect x="510" y="235" width="410" height="310" rx="10" fill="#f0f8ea" stroke="#83a66f" stroke-width="2"/><text x="533" y="268" font-size="22" fill="#203339" text-anchor="start" font-weight="bold">BOARD B - 70 x 50 mm</text><text x="533" y="296" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">Both field cables attach here.</text><text x="615" y="336" font-size="18" fill="#203339" text-anchor="middle" font-weight="bold">J1 PRESSURE</text><rect x="535" y="350" width="160" height="70" rx="3" fill="#28794b" stroke="#15592f" stroke-width="2"/><circle cx="562" cy="372" r="8" fill="#d5ded3"/><text x="562" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">1</text><text x="562" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">+5V</text><circle cx="615" cy="372" r="8" fill="#d5ded3"/><text x="615" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">2</text><text x="615" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">GND</text><circle cx="668" cy="372" r="8" fill="#d5ded3"/><text x="668" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">3</text><text x="668" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">SIG</text><text x="815" y="336" font-size="18" fill="#203339" text-anchor="middle" font-weight="bold">J2 TEMP</text><rect x="735" y="350" width="160" height="70" rx="3" fill="#28794b" stroke="#15592f" stroke-width="2"/><circle cx="762" cy="372" r="8" fill="#d5ded3"/><text x="762" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">1</text><text x="762" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">3V3</text><circle cx="815" cy="372" r="8" fill="#d5ded3"/><text x="815" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">2</text><text x="815" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">DATA</text><circle cx="868" cy="372" r="8" fill="#d5ded3"/><text x="868" y="405" font-size="15" fill="white" text-anchor="middle" font-weight="normal">3</text><text x="868" y="441" font-size="14" fill="#203339" text-anchor="middle" font-weight="bold">GND</text><text x="540" y="485" font-size="19" fill="#203339" text-anchor="start" font-weight="bold">R5 4.7k: J2-1 to J2-2</text><text x="540" y="516" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">Three screws per block. Six sensor wires.</text><text x="36" y="574" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">All other connections are internal insulated wires or solder links, not extra plug-in sensors.</text></svg>