<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 805" role="img" aria-label="Correct pressure divider and separate DS18B20 data pull-up. C2 is supply decoupling, not signal filtering." style="font-family:Arial,sans-serif"><title>Correct pressure divider and separate DS18B20 data pull-up. C2 is supply decoupling, not signal filtering.</title><rect width="980" height="805" fill="#fcfdfb"/><text x="25" y="35" font-size="23" fill="#203339" text-anchor="start" font-weight="bold">PRESSURE: Board B J1 -&gt; Board A -&gt; ADS1115 A0</text><text x="25" y="72" font-size="18" fill="#203339" text-anchor="start" font-weight="normal">J1-1 +5V -&gt; ESP VSYS     J1-2 GND -&gt; common GND</text><text x="25" y="119" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">J1-3 SIG</text><line x1="130" y1="145" x2="178.5" y2="145" stroke="#46565b" stroke-width="3"/><rect x="178.5" y="136" width="58" height="18" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="236.5" y1="145" x2="285" y2="145" stroke="#46565b" stroke-width="3"/><text x="207.5" y="126" font-size="16" fill="#203339" text-anchor="middle" font-weight="bold">R1 10k</text><line x1="285" y1="145" x2="440" y2="145" stroke="#46565b" stroke-width="3"/><circle cx="350" cy="145" r="5" fill="#086c65"/><text x="350" y="119" font-size="18" fill="#203339" text-anchor="middle" font-weight="bold">DIV</text><line x1="440" y1="145" x2="503.5" y2="145" stroke="#46565b" stroke-width="3"/><rect x="503.5" y="136" width="58" height="18" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="561.5" y1="145" x2="625" y2="145" stroke="#46565b" stroke-width="3"/><text x="532.5" y="126" font-size="16" fill="#203339" text-anchor="middle" font-weight="bold">R4 1k</text><line x1="625" y1="145" x2="900" y2="145" stroke="#46565b" stroke-width="3"/><circle cx="730" cy="145" r="5" fill="#086c65"/><text x="821" y="120" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">ADS A0</text><line x1="350" y1="145" x2="350" y2="177.0" stroke="#46565b" stroke-width="3"/><rect x="341" y="177.0" width="18" height="46" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="350" y1="223.0" x2="350" y2="255" stroke="#46565b" stroke-width="3"/><text x="370" y="205.0" font-size="16" fill="#203339" text-anchor="start" font-weight="bold">R2 10k</text><circle cx="350" cy="255" r="5" fill="#086c65"/><text x="278" y="263" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">MID</text><line x1="350" y1="255" x2="350" y2="287.0" stroke="#46565b" stroke-width="3"/><rect x="341" y="287.0" width="18" height="46" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="350" y1="333.0" x2="350" y2="365" stroke="#46565b" stroke-width="3"/><text x="370" y="315.0" font-size="16" fill="#203339" text-anchor="start" font-weight="bold">R3 4.7k</text><line x1="350" y1="365" x2="900" y2="365" stroke="#46565b" stroke-width="3"/><line x1="730" y1="145" x2="730" y2="250.0" stroke="#46565b" stroke-width="3"/><line x1="714" y1="250.0" x2="746" y2="250.0" stroke="#46565b" stroke-width="3"/><line x1="714" y1="260.0" x2="746" y2="260.0" stroke="#46565b" stroke-width="3"/><line x1="730" y1="260.0" x2="730" y2="365" stroke="#46565b" stroke-width="3"/><text x="754" y="261.0" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">C1 100nF</text><circle cx="730" cy="365" r="5" fill="#086c65"/><text x="810" y="394" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">GND</text><text x="25" y="422" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">C2 100nF goes across ADS VDD (+3V3) and ADS GND. It is NOT on the temperature DATA wire.</text><line x1="25" y1="449" x2="950" y2="449" stroke="#c4d0cb" stroke-width="2"/><text x="25" y="487" font-size="22" fill="#203339" text-anchor="start" font-weight="bold">TEMPERATURE: Board B J2 -&gt; ESP32 GPIO18 (not through the ADS)</text><text x="25" y="545" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">ESP 3V3</text><line x1="155" y1="540" x2="855" y2="540" stroke="#b66a10" stroke-width="3"/><text x="865" y="546" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">J2-1</text><text x="25" y="665" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">ESP GPIO18</text><line x1="155" y1="660" x2="855" y2="660" stroke="#8257a5" stroke-width="3"/><text x="865" y="666" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">J2-2 DATA</text><line x1="475" y1="540" x2="475" y2="577.0" stroke="#46565b" stroke-width="3"/><rect x="466" y="577.0" width="18" height="46" rx="2" fill="#f7e5c4" stroke="#8a704b" stroke-width="2"/><line x1="475" y1="623.0" x2="475" y2="660" stroke="#46565b" stroke-width="3"/><text x="495" y="605.0" font-size="16" fill="#203339" text-anchor="start" font-weight="bold">R5 4.7k</text><circle cx="475" cy="540" r="5" fill="#086c65"/><circle cx="475" cy="660" r="5" fill="#086c65"/><text x="25" y="725" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">ESP GND</text><line x1="155" y1="720" x2="855" y2="720" stroke="#46565b" stroke-width="3"/><text x="865" y="726" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">J2-3</text><text x="25" y="778" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">J1 and J2 numbers refer to labels you put on the terminal blocks. Nothing connects +5V to +3V3.</text></svg>