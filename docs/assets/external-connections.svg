<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" role="img" aria-label="Exactly three external connections: Ethernet RJ45, J1 pressure and J2 temperature. J1 and J2 each have three terminals." style="font-family:Arial,sans-serif"><title>Exactly three external connections: Ethernet RJ45, J1 pressure and J2 temperature. J1 and J2 each have three terminals.</title><rect width="980" height="490" fill="#fcfdfb"/><rect x="275" y="25" width="675" height="445" rx="18" fill="#f1f5f0" stroke="#879c95" stroke-width="2"/><text x="305" y="57" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">INSIDE THE ENCLOSURE</text><rect x="325" y="85" width="575" height="100" rx="10" fill="#e7eff3" stroke="#849da8" stroke-width="2"/><text x="380" y="116" font-size="22" fill="#203339" text-anchor="start" font-weight="bold">Existing ESP32-S3 + PoE module</text><text x="380" y="145" font-size="17" fill="#203339" text-anchor="start" font-weight="normal">RJ45 accepts the network cable. It also supplies power.</text><text x="380" y="169" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">No separate external power connector.</text><rect x="295" y="108" width="65" height="45" rx="3" fill="#d5dfe5" stroke="#849da8" stroke-width="2"/><text x="327" y="137" font-size="15" fill="#203339" text-anchor="middle" font-weight="bold">RJ45</text><line x1="42" y1="132" x2="292" y2="132" stroke="#2564b6" stroke-width="8"/><text x="45" y="96" font-size="19" fill="#2564b6" text-anchor="start" font-weight="bold">1. ETHERNET / PoE</text><text x="45" y="162" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">one cable</text><rect x="560" y="225" width="335" height="195" rx="10" fill="#edf5e9" stroke="#7ca779" stroke-width="2"/><text x="580" y="253" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">BOARD B: both sensor blocks</text><text x="597" y="279" font-size="13" fill="#203339" text-anchor="start" font-weight="bold">J1</text><g data-terminal-block="J1"><rect x="590" y="285" width="285" height="48" rx="3" fill="#28794b" stroke="#12552d" stroke-width="2"/><circle cx="632" cy="298" r="6" fill="#d5ded3"/><text x="632" y="322" font-size="15" fill="white" text-anchor="middle" font-weight="bold">1 +5V</text><circle cx="726" cy="298" r="6" fill="#d5ded3"/><text x="726" y="322" font-size="15" fill="white" text-anchor="middle" font-weight="bold">2 GND</text><circle cx="820" cy="298" r="6" fill="#d5ded3"/><text x="820" y="322" font-size="15" fill="white" text-anchor="middle" font-weight="bold">3 SIG</text></g><text x="597" y="354" font-size="13" fill="#203339" text-anchor="start" font-weight="bold">J2</text><g data-terminal-block="J2"><rect x="590" y="360" width="285" height="48" rx="3" fill="#28794b" stroke="#12552d" stroke-width="2"/><circle cx="632" cy="373" r="6" fill="#d5ded3"/><text x="632" y="397" font-size="15" fill="white" text-anchor="middle" font-weight="bold">1 3V3</text><circle cx="726" cy="373" r="6" fill="#d5ded3"/><text x="726" y="397" font-size="15" fill="white" text-anchor="middle" font-weight="bold">2 DATA</text><circle cx="820" cy="373" r="6" fill="#d5ded3"/><text x="820" y="397" font-size="15" fill="white" text-anchor="middle" font-weight="bold">3 GND</text></g><text x="30" y="276" font-size="18" fill="#203339" text-anchor="start" font-weight="bold">2. PRESSURE SENSOR</text><text x="30" y="342" font-size="15" fill="#203339" text-anchor="start" font-weight="normal">three-wire cable</text><text x="30" y="355" font-size="17" fill="#203339" text-anchor="start" font-weight="bold">3. TEMPERATURE PROBE</text><text x="30" y="425" font-size="15" fill="#203339" text-anchor="start" font-weight="normal">three-wire cable</text><line x1="35" y1="298" x2="588" y2="298" stroke="#46565b" stroke-width="2"/><line x1="35" y1="309" x2="588" y2="309" stroke="#46565b" stroke-width="2"/><line x1="35" y1="320" x2="588" y2="320" stroke="#46565b" stroke-width="2"/><line x1="35" y1="373" x2="588" y2="373" stroke="#46565b" stroke-width="2"/><line x1="35" y1="384" x2="588" y2="384" stroke="#46565b" stroke-width="2"/><line x1="35" y1="395" x2="588" y2="395" stroke="#46565b" stroke-width="2"/><text x="305" y="447" font-size="16" fill="#203339" text-anchor="start" font-weight="normal">Board A and internal jumper wires are omitted here for clarity.</text></svg>